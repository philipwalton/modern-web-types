name: Update types

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump upstream generator to latest main before building"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: npm ci

      - name: Bump pinned sources
        if: github.event_name == 'schedule' || inputs.bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/bump-upstream.ts

      - name: Regenerate types
        run: npm run update

      - name: Test
        run: npm test

      # report.md embeds a generation timestamp, so it differs on every run.
      # Reverting it when nothing else in it changed lets create-pull-request
      # see a clean tree and skip opening a PR.
      - name: Drop timestamp-only report changes
        run: |
          if git diff --quiet -I '^Generated ' -- report.md; then
            git checkout -- report.md
          fi

      - name: Open PR
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            pkg/**
            upstream.json
            registry.json
            report.md
          branch: automated/update-types
          title: "Regenerate types from latest web platform data"
          commit-message: "Regenerate types from latest web platform data"
          body: |
            Automated regeneration from the pinned upstream generator.
            See `report.md` for the current gap.
          labels: automated
