name: Update types

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump upstream generator to latest main before building"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - run: npm ci

      - name: Bump pinned sources
        if: github.event_name == 'schedule' || inputs.bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/bump-upstream.ts

      - name: Regenerate types
        run: npm run update

      - name: Test
        run: npm test

      - name: Bump package version for declaration changes
        run: |
          # Reuse the open PR's version, including any reviewer adjustment.
          # Always compare against main so reruns don't increment it again.
          branch=automated/update-types
          existing=$(git ls-remote --heads origin "refs/heads/$branch")
          if [ -n "$existing" ]; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            node scripts/bump-version.ts "refs/remotes/origin/$branch"
          else
            node scripts/bump-version.ts
          fi

      # report.md embeds a generation timestamp, so it differs on every run.
      # Reverting it when nothing but the timestamp changed lets
      # create-pull-request see a clean tree and skip opening a PR. The rest
      # of the "Generated" line, including the generator SHA, is compared.
      - name: Drop timestamp-only report changes
        run: |
          strip() { sed -E 's/^Generated [^ ]+ /Generated /'; }
          if diff -q <(git show HEAD:report.md | strip) <(strip < report.md) > /dev/null; then
            git checkout -- report.md
          fi

      - name: Open PR
        uses: peter-evans/create-pull-request@v8
        with:
          add-paths: |
            pkg/**
            upstream.json
            registry.json
            report.md
          branch: automated/update-types
          title: "Regenerate types from latest web platform data"
          commit-message: "Regenerate types from latest web platform data"
          body: |
            Automated regeneration from the pinned upstream generator.
            See `report.md` for the current gap.
            Declaration changes default to a minor version bump; adjust
            `pkg/package.json` in this PR if a different version is appropriate.
          labels: automated
