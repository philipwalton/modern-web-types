name: Publish package

on:
  push:
    branches: [main]
    paths:
      - pkg/package.json
  workflow_dispatch:

permissions:
  contents: write # push the release tag
  id-token: write # npm trusted publishing

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest

      # Auth is the OIDC token, which npm exchanges for a short-lived
      # credential on its own. It only does that when it finds no credential
      # already configured, so this step must not set NODE_AUTH_TOKEN and
      # setup-node above must not set `registry-url` — that writes an
      # `_authToken` line into .npmrc, which npm reads as "already
      # authenticated" and then publishes with an empty credential.
      - id: publish
        run: node scripts/publish.ts

      - name: Tag release
        if: steps.publish.outputs.published == 'true'
        run: |
          git tag "v${{ steps.publish.outputs.version }}"
          git push origin "v${{ steps.publish.outputs.version }}"
